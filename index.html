<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf2f7" />
    <meta
      name="description"
      content="Generatore di numeri casuali interi da 1 a 100."
    />
    <title>Casuale — Numero casuale</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="generator-layout">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">Generatore</p>
          <h1 id="page-title">Numero<br />casuale.</h1>
          <p class="intro-copy">Estrai un intero da 1 a 100.</p>

          <button class="draw-button" id="draw-button" type="button">
            <span class="draw-button__label">Genera</span>
            <span class="draw-button__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M7 12h10" />
                <path d="m13 6 6 6-6 6" />
              </svg>
            </span>
          </button>
        </section>

        <section class="result-panel" aria-labelledby="result-label">
          <div class="result-panel__topline">
            <p id="result-label">Risultato</p>
          </div>

          <div class="number-stage" id="number-stage">
            <output
              class="number"
              id="number-output"
              aria-live="polite"
              aria-atomic="true"
            >--</output>
          </div>

          <div class="result-panel__footer">
            <span>1</span>
            <span>100</span>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Generazione locale nel browser.</p>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
