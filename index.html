<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#edf2f7" />
    <meta
      name="description"
      content="Generatore di sequenze numeriche casuali da 1 a 8 cifre."
    />
    <title>Casuale — Numero casuale</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main class="generator-layout">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">Generatore</p>
          <h1 id="page-title">Numero<br />casuale.</h1>
          <p class="intro-copy">Genera una sequenza numerica casuale.</p>

          <div class="digit-control">
            <span class="digit-control__label" id="digit-control-label">Cifre</span>
            <div
              class="digit-segments"
              role="radiogroup"
              aria-labelledby="digit-control-label"
            >
              <button type="button" role="radio" data-digits="1" aria-checked="false" tabindex="-1">1</button>
              <button type="button" role="radio" data-digits="2" aria-checked="false" tabindex="-1">2</button>
              <button type="button" role="radio" data-digits="3" aria-checked="false" tabindex="-1">3</button>
              <button type="button" role="radio" data-digits="4" aria-checked="true" tabindex="0">4</button>
              <button type="button" role="radio" data-digits="5" aria-checked="false" tabindex="-1">5</button>
              <button type="button" role="radio" data-digits="6" aria-checked="false" tabindex="-1">6</button>
              <button type="button" role="radio" data-digits="7" aria-checked="false" tabindex="-1">7</button>
              <button type="button" role="radio" data-digits="8" aria-checked="false" tabindex="-1">8</button>
            </div>
          </div>

          <button class="draw-button" id="draw-button" type="button">Genera</button>
        </section>

        <section class="result-panel" aria-labelledby="result-label">
          <div class="result-panel__topline">
            <p id="result-label">Risultato</p>
            <span id="result-digits">4 cifre</span>
          </div>

          <div class="number-stage" id="number-stage">
            <output
              class="number is-placeholder"
              id="number-output"
              data-digits="4"
              aria-live="polite"
              aria-atomic="true"
            >--</output>

            <div class="pending-indicator" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>

          <div class="result-panel__footer" aria-label="Intervallo possibile">
            <span id="range-min">0000</span>
            <span id="debug-source" hidden aria-live="polite"></span>
            <span id="range-max">9999</span>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Generazione locale nel browser.</p>
      </footer>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
